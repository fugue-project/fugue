# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Spark Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_combinations:
    name: Test Spark ${{ matrix.spark-version }} Pandas ${{ matrix.pandas-version }} Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        spark-version: ["3.5.8", "4.0.4", "4.3.0"]
        pandas-version: ["2.2.3", "2.3.3"]
        include:
          - python-version: "3.11"
            spark-version: "latest"
            pandas-version: "latest"

    steps:
    - name: Clone repo
      uses: actions/checkout@v5

    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup uv ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: false
        cache-dependency-glob: "pyproject.toml"
        python-version: ${{ matrix.python-version }}

    - name: Update Spark
      if: matrix.spark-version != 'latest'
      run: uv add "pyspark==${{ matrix.spark-version }}; python_version=='${{ matrix.python-version }}'"

    - name: Update Pandas
      if: matrix.pandas-version != 'latest'
      run: uv add "pandas==${{ matrix.pandas-version }}; python_version=='${{ matrix.python-version }}'"

    - name: Install dependencies
      run: |
        make devenv upgrade=1

    - name: Test
      run: make testspark

  test_connect:
    name: Spark Connect
    runs-on: ubuntu-latest
    env:
      FUGUE_SPARK_VERSION: ${{ matrix.spark-version }}
    strategy:
      matrix:
        python-version: ["3.11"]
        spark-version: ["3.5.8", "4.0.4", "4.3.0"]
        pandas-version: ["2.3.3"]

    steps:
    - name: Clone repo
      uses: actions/checkout@v5

    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup uv ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: false
        cache-dependency-glob: "pyproject.toml"
        python-version: ${{ matrix.python-version }}

    - name: Update Spark
      run: uv add "pyspark[connect]==${{ matrix.spark-version }}; python_version=='${{ matrix.python-version }}'"

    - name: Update Pandas
      if: matrix.pandas-version != 'latest'
      run: uv add "pandas==${{ matrix.pandas-version }}; python_version=='${{ matrix.python-version }}'"

    - name: Install dependencies
      run: |
        make devenv upgrade=1

    - name: Test
      run: |
        make sparkconnect
        make testsparkconnect
